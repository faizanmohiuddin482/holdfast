# Render Blueprint: one free web service. Data lives in Firestore (FIREBASE_SERVICE_ACCOUNT).
# Secrets are marked sync: false, so Render asks for them when the Blueprint is created; nothing secret is in this file.
services:
  - type: web
    name: holdfast
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      # Same value as PAYPAL_CLIENT_ID; read by the browser's PayPal button (inlined at build time).
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # The Firebase service-account key JSON, pasted as one value.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # The named Firestore database inside that project.
      - key: FIRESTORE_DATABASE_ID
        value: holdfast
      # This service's public URL (e.g. https://holdfast.onrender.com), used in links handed to agents.
      - key: HOLDFAST_PUBLIC_URL
        sync: false
